openapi: 3.1.0
info:
  title: PORTIQA Portfolio Analysis API
  version: "2026-11-18"
  description: >-
    Evaluate stock portfolios and return their score, qualitative component
    assessments, holding exposures, data coverage and comparison results.
  contact:
    name: PORTIQA Support
    email: hello@portiqa.ai
    url: https://portiqa.ai/docs/
  license:
    name: PORTIQA Terms of Service
    url: https://portiqa.ai/legal/terms.html
servers:
  - url: https://portiqa.ai
    description: Production
paths:
  /evaluate:
    post:
      operationId: evaluatePortfolio
      summary: Evaluate a portfolio
      description: >-
        Returns the portfolio score, its main drivers and data coverage.
        Duplicate canonical tickers are consolidated before scoring and plan
        ticker caps. Only successful evaluations consume the monthly allowance,
        including on annual subscriptions. Request bodies are limited to 256 KiB
        and 500 raw position rows. Responses are private and not cacheable and
        include a request_id matching the X-Request-ID response header.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Portiqa-Response-Profile
          required: false
          description: Select the documented public response for this request. New accounts receive this response by default. Accounts with an existing integration can send this header to preview or adopt it.
          schema: { type: string, enum: [public] }
          example: public
        - in: header
          name: Idempotency-Key
          required: false
          description: Reuse this key only when retrying the same payload. An already completed evaluation returns 409 with its original request ID and uses no additional credit.
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
            examples:
              marketValues:
                summary: Three positions and cash
                value:
                  risk_level: medium
                  cash_balance: 5000
                  positions:
                    - ticker: AAPL
                      market_value: 25000
                    - ticker: MSFT
                      market_value: 22000
                    - ticker: NVDA
                      market_value: 8000
      responses:
        "200":
          description: Portfolio evaluated successfully. The schema describes the public response profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationEnvelope"
        "400":
          description: Invalid JSON or nonfinite/negative numbers, overflowing totals, missing prices/positions, invalid risk level, or no evaluable positions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: API key is missing or invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: An authenticated account has not accepted the current API and MCP usage disclaimer. No evaluation is counted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: Method is not POST.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: This idempotency key is associated with an already completed evaluation. The response includes the original request ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Body exceeds 256 KiB, raw position rows exceed 500, or unique tickers exceed the effective plan limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: A short-window request limit or the shared monthly evaluation allowance was reached. Short-window limits supply Retry-After. Monthly limits include the UTC reset timestamp.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Evaluation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Authentication/accounting is unavailable or another evaluation holds this account's quota lock. Retry after the Retry-After interval.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PORTIQA API key
      description: Generate a ptq_ bearer token in the PORTIQA dashboard.
  schemas:
    EvaluationRequest:
      type: object
      required: [positions]
      properties:
        risk_level:
          type: string
          enum: [low, medium, high]
          default: medium
        cash_balance:
          type: number
          minimum: 0
          default: 0
          description: Cash in the same currency as position values.
        positions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/Position"
      additionalProperties: false
    Position:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
          minLength: 1
          examples: [AAPL]
        market_value:
          type: number
          minimum: 0
          description: A finite positive market value takes precedence over amount on this row. All values must use the same currency.
        amount:
          type: number
          minimum: 0
          description: Used with the latest available close price when market_value is absent.
      anyOf:
        - required: [market_value]
        - required: [amount]
      additionalProperties: false
    EvaluationEnvelope:
      type: object
      required: [ok, evaluation, request_id]
      properties:
        ok:
          type: boolean
          const: true
        evaluation:
          $ref: "#/components/schemas/Evaluation"
        request_id: { type: string, pattern: "^[a-f0-9]{32}$" }
    Evaluation:
      type: object
      required:
        - engine_version
        - score
        - status
        - max_position_weight
        - effective_positions
        - score_components
        - component_assessments
        - score_drivers
        - analysis_coverage
        - coverage
        - diagnostics
        - portfolio_input
        - data_sources
      properties:
        engine_version: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        health_score: { type: number, minimum: 0, maximum: 100 }
        status: { type: string }
        status_key: { type: string }
        count: { type: integer, minimum: 0 }
        max_position_weight: { type: number, minimum: 0, maximum: 100 }
        max_position_ticker: { type: string }
        effective_positions: { type: number, minimum: 0 }
        weighted_beta: { type: [number, "null"] }
        top_sector: { type: [string, "null"] }
        top_sector_weight: { type: number, minimum: 0, maximum: 100 }
        score_components:
          type: object
          maxProperties: 0
          description: Empty compatibility object in the public profile. Read component_assessments for the current breakdown.
        component_assessments:
          type: object
          description: Qualitative results for each component. Null indicates insufficient evidence.
          properties:
            diversification: { $ref: '#/components/schemas/AssessmentBand' }
            risk: { $ref: '#/components/schemas/AssessmentBand' }
            quality: { $ref: '#/components/schemas/AssessmentBand' }
            signal: { $ref: '#/components/schemas/AssessmentBand' }
            trend: { $ref: '#/components/schemas/AssessmentBand' }
            macro: { $ref: '#/components/schemas/AssessmentBand' }
        score_drivers:
          type: array
          maxItems: 3
          description: Main aspects of this result to review. The list may be shorter when evidence is limited.
          items:
            type: object
            required: [component, explanation]
            properties:
              component: { type: string }
              explanation: { type: string }
        analysis_coverage:
          type: object
          required: [submitted_ticker_count, analyzed_ticker_count, analyzed_invested_value_pct, excluded_holdings, funds_without_lookthrough]
          properties:
            submitted_ticker_count: { type: integer, minimum: 1 }
            analyzed_ticker_count: { type: integer, minimum: 1 }
            analyzed_invested_value_pct:
              type: [number, "null"]
              minimum: 0
              maximum: 100
              description: Share of submitted invested value included in the score, with duplicate symbols consolidated and cash excluded. Null when an excluded share-only position cannot be valued.
            excluded_holdings:
              type: array
              items: { $ref: "#/components/schemas/ExcludedHolding" }
            funds_without_lookthrough:
              type: array
              description: Recognized ETFs and funds scored as positions whose underlying holdings, sector exposure, and overlap are unavailable.
              items:
                type: object
                required: [ticker, type, analyzed_weight_pct]
                properties:
                  ticker: { type: string }
                  type: { type: string, enum: [etf, fund] }
                  analyzed_weight_pct: { type: number, minimum: 0, maximum: 100 }
        coverage:
          type: object
          description: Includes signal_pct (holding count), signal_weight_pct and trend_weight_pct (invested value), plus other field coverage.
          additionalProperties: { type: number }
        data_sources:
          type: object
          description: Source availability and UTC snapshot dates. An individual signal date applies to that signal only. Some sources also report holding counts.
          additionalProperties:
            type: object
            properties:
              as_of_date: { type: [string, "null"], format: date }
              newest_as_of_date: { type: [string, "null"], format: date }
              status: { type: string }
              available_holdings: { type: integer, minimum: 0 }
              unavailable_holdings: { type: integer, minimum: 0 }
              total_holdings: { type: integer, minimum: 0 }
        holding_analysis:
          type: array
          description: Analyzed positions with invested portfolio weight, sector and technical signal label when available.
          items:
            type: object
            properties:
              ticker: { type: string }
              weight_pct: { type: number, minimum: 0, maximum: 100 }
              sector: { type: [string, "null"] }
              signal: { type: string, description: UNKNOWN indicates unavailable evidence. }
              signal_source:
                type: object
                properties:
                  status: { type: string }
                  as_of_date: { type: [string, "null"], format: date }
        diagnostics:
          type: object
          properties:
            risk_level: { type: string }
            data_gaps:
              type: array
              items: { type: string }
        weak_holdings:
          type: array
          maxItems: 3
          description: Holdings highlighted for review, with simulated alternatives where available. Included comparisons use the same evaluation credit.
          items:
            $ref: '#/components/schemas/WeakHolding'
        portfolio_input:
          type: object
          properties:
            cash_balance: { type: number }
            holdings_value: { type: number }
            total_value: { type: number }
            cash_pct: { type: number }
            invested_pct: { type: number }
            missing_tickers:
              type: array
              items: { type: string }
          additionalProperties: true
      additionalProperties: true
    AssessmentBand:
      type: [string, "null"]
      enum: [lower, middle, upper, null]
    WeakHolding:
      type: object
      required: [ticker, weight_pct, signal, signal_as_of, alternatives_status, alternatives]
      properties:
        ticker: { type: string }
        weight_pct: { type: number, description: Percent of analyzed invested value. }
        signal: { type: string }
        signal_as_of: { type: string, format: date }
        alternatives_status:
          type: string
          enum: [available, no_comparable_stock, insufficient_profile, fund_comparison_unavailable, source_unavailable]
        alternatives:
          type: array
          maxItems: 2
          description: Comparable stocks for a hypothetical substitution. The list can be empty. Check alternatives_status for availability.
          items:
            $ref: '#/components/schemas/StockAlternative'
    StockAlternative:
      type: object
      required: [ticker, name, industry, exchange, currency, signal_as_of, impact]
      properties:
        ticker: { type: string }
        name: { type: string }
        industry: { type: string }
        exchange: { type: string }
        currency: { type: string }
        signal_as_of: { type: string, format: date }
        impact:
          type: object
          description: An independent simulated swap at the original position's market value, with the same risk profile. Changes are the displayed after value minus the displayed before value.
          required: [score, weighted_beta, largest_position_weight_pct, largest_sector_weight_pct]
          properties:
            score: { $ref: '#/components/schemas/SwapMetric' }
            weighted_beta: { $ref: '#/components/schemas/SwapMetric' }
            largest_position_weight_pct: { $ref: '#/components/schemas/SwapMetric' }
            largest_sector_weight_pct: { $ref: '#/components/schemas/SwapMetric' }
    SwapMetric:
      type: object
      description: Concentration changes are percentage points. Beta change is null if a value is unavailable or beta coverage differs between portfolios.
      required: [before, after, change]
      properties:
        before: { type: [number, 'null'] }
        after: { type: [number, 'null'] }
        change: { type: [number, 'null'] }
    ExcludedHolding:
      type: object
      required: [ticker, reason]
      properties:
        ticker: { type: string }
        reason: { type: string, enum: [unresolved_ticker, zero_position_value] }
    Error:
      type: object
      required: [ok, error, request_id]
      properties:
        ok:
          type: boolean
          const: false
        error: { type: string }
        title: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        retry_after_seconds: { type: integer, minimum: 1 }
        original_request_id: { type: string }
        excluded_holdings:
          type: array
          items: { $ref: "#/components/schemas/ExcludedHolding" }
        reset_at: { type: string, format: date-time }
        disclaimer_version: { type: string }
        actions:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string, format: uri }
        request_id: { type: string, pattern: "^[a-f0-9]{32}$" }
      additionalProperties: true
externalDocs:
  description: PORTIQA API documentation
  url: https://portiqa.ai/docs/api-reference.html
